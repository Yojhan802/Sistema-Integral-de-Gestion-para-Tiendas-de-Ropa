server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Con un nombre literal en proxy_pass, nginx resuelve "backend" una sola vez al
  # arrancar y se queda con esa IP: al recrear el contenedor del backend cambia la
  # IP y todo /api responde 502 hasta reiniciar este servicio. Con el resolver de
  # Docker y el host en una variable, la resolución ocurre por petición.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  # X-Forwarded-Host lleva $http_host (con puerto) a propósito: el backend compara
  # ese valor con la cabecera Origin para reconocer una petición del mismo origen,
  # y $host descartaría el puerto, que sí forma parte del origen del navegador.
  location /api/ { set $backend_host backend; proxy_pass http://$backend_host:8080$request_uri; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_cache off; proxy_read_timeout 1800s; }
  location /uploads/ { set $backend_host backend; proxy_pass http://$backend_host:8080$request_uri; proxy_set_header Host $host; }
}
