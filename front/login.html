<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="page-title">Iniciar sesión · Qynex</title>
    <link
      rel="icon"
      type="image/png"
      href="assets/brand/logo-mark-dark.png?v=qynex"
    />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="login-screen">
      <aside class="login-brand-panel" aria-hidden="true">
        <div class="brand-mark">
          <img
            id="brand-logo-desktop"
            src="assets/brand/logo-mark-light.png"
            alt=""
            style="visibility: hidden"
          />
          <span id="brand-name-desktop" style="visibility: hidden">Qynex</span>
        </div>
        <div class="brand-copy">
          <h2>Gestiona tu tienda de principio a fin.</h2>
          <p>
            Productos, inventario, ventas, caja y reportes en un solo sistema,
            pensado para el día a día de una tienda de ropa.
          </p>
        </div>
        <p class="brand-footer" id="brand-footer" style="visibility: hidden">
          © 2026 Qynex — Sistema Integral de Gestión
        </p>
      </aside>

      <main class="login-form-panel">
        <div class="login-form-card">
          <div class="login-logo-mobile">
            <img
              id="brand-logo-mobile"
              src="assets/brand/logo-mark-dark.png?v=qynex"
              alt="Qynex"
              style="visibility: hidden"
            />
          </div>

          <h1>Iniciar sesión</h1>
          <p>Ingresa tus credenciales para acceder al sistema.</p>

          <div class="alert alert-danger" id="login-error" role="alert" hidden>
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="10" cy="10" r="8" />
              <path d="M10 6v5M10 14h.01" stroke-linecap="round" />
            </svg>
            <span class="alert-message"></span>
          </div>

          <form class="login-form" id="login-form" novalidate>
            <div class="field">
              <label class="field-label" for="username">Usuario</label>
              <input
                class="input"
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                placeholder="tu.usuario"
              />
            </div>

            <div class="field">
              <label class="field-label" for="password">Contraseña</label>
              <div class="input-group">
                <input
                  class="input"
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  required
                  placeholder="••••••••"
                  style="padding-right: 44px"
                />
                <button
                  class="input-group-action"
                  type="button"
                  id="toggle-password"
                  aria-label="Mostrar contraseña"
                >
                  <svg
                    data-icon-closed
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    data-icon-open
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    hidden
                  >
                    <path
                      d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.9 5.1A11 11 0 0122 12s-1.4 2.5-4 4.4M6.1 6.1C3.7 7.6 2 10 2 12s4 7 11 7c1.4 0 2.7-.2 3.9-.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="login-form-footer">
              <label class="checkbox-field">
                <input type="checkbox" name="remember" />
                Recordarme
              </label>
            </div>

            <button
              class="btn btn-primary btn-lg btn-block"
              type="submit"
              id="login-submit"
            >
              <span class="spinner" hidden></span>
              <span class="btn-label">Ingresar</span>
            </button>
          </form>
        </div>
      </main>
    </div>

    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
