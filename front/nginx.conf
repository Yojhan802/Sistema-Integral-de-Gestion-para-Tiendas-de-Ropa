server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker, necesario para que los proxy_pass con variable vuelvan a
    # resolver "backend" en cada petición (ver el comentario en /api/).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend estático (HTML/CSS/JS planos, sin build step ni router de cliente).
    location / {
        try_files $uri $uri/ =404;
    }

    # Durante la evolución del storefront, HTML/CSS/JS deben revalidarse para
    # que una plantilla recién publicada no quede atrapada en la caché del
    # navegador. Las imágenes y demás recursos binarios mantienen su caché.
    location ~* \.(?:html|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # El backend queda solo en la red interna de Docker; el navegador únicamente
    # habla con este origen, así que el frontend usa rutas relativas /api y /uploads
    # (ver js/core/api.js) y este proxy las reenvía al servicio "backend".
    #
    # El host va en una variable y con el resolver de Docker a propósito: con un
    # nombre literal, nginx resuelve "backend" solo al arrancar y se queda con esa
    # IP, así que recrear el contenedor del backend deja todo /api en 502 hasta
    # reiniciar este servicio.
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Con puerto a propósito: el backend lo compara con Origin para reconocer una
        # petición del mismo origen, y $host descartaría el puerto.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
    }

    location /uploads/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_set_header Host $host;
    }
}
