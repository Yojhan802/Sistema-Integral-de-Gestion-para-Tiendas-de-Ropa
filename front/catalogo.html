<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo · Qynex</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-mark-dark.png?v=qynex" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div class="app-shell">
    <div id="shell-sidebar" style="display:contents"></div>
    <div id="shell-topbar" style="display:contents"></div>

    <main class="content" id="main-content">
      <div class="page-header">
        <div>
          <h1>Catálogo</h1>
          <p>Categorías, subcategorías, marcas y los atributos (color, talla, u otros) disponibles para los productos.</p>
        </div>
        <div class="page-actions">
          <a href="productos.html" class="btn btn-secondary">Volver a productos</a>
          <button class="btn btn-primary" type="button" id="btn-nuevo-item">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            <span id="btn-nuevo-item-label">Nueva categoría</span>
          </button>
        </div>
      </div>

      <div class="tabs" role="tablist" style="margin-bottom: var(--space-5);" id="catalogo-tabs">
        <button class="tab" type="button" data-tab="categorias" role="tab" aria-selected="true">Categorías</button>
        <button class="tab" type="button" data-tab="subcategorias" role="tab" aria-selected="false">Subcategorías</button>
        <button class="tab" type="button" data-tab="marcas" role="tab" aria-selected="false">Marcas</button>
        <!-- Las pestañas de atributos (Color, Talla, u otros que defina el negocio) se agregan acá en tiempo de ejecución. -->
        <button class="tab" type="button" id="tab-nuevo-atributo" role="tab" aria-selected="false" style="border-style:dashed;">+ Atributo</button>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead id="catalogo-head"></thead>
            <tbody id="catalogo-body"><tr><td colspan="4"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/catalogo.js"></script>
</body>
</html>
