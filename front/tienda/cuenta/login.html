<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar · Qynex</title>
  <link rel="icon" type="image/png" href="../../assets/brand/logo-mark-dark.png?v=qynex" />
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../css/storefront.css" />
</head>
<body class="store-body">
  <div class="store-promo-bar">Envíos a todo el Perú &nbsp;·&nbsp; Yape &nbsp;·&nbsp; Plin &nbsp;·&nbsp; Contraentrega en Huacho</div>
  <header class="store-header" id="store-header"></header>

  <main class="store-auth-page">
    <div class="store-auth-card">
      <h1 style="font-size: var(--font-size-xl);">Ingresa a tu cuenta</h1>
      <form id="login-form">
        <div class="field" style="margin-bottom: var(--space-3);">
          <label class="field-label" for="email">Correo</label>
          <input class="input" type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field" style="margin-bottom: var(--space-4);">
          <label class="field-label" for="password">Contraseña</label>
          <input class="input" type="password" id="password" required autocomplete="current-password" />
        </div>
        <div id="login-error"></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Ingresar</button>
      </form>
      <p style="text-align:center; margin:0;">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
  </main>

  <footer class="store-footer" id="store-footer"></footer>

  <script type="module" src="../js/store/login.js"></script>
</body>
</html>
